<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Verbal Communication Skills Trainer</title>  
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>  
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 20px; }
        h1 { color: #007BFF; }
        textarea { width: 80%; height: 50px; }
        button { margin: 10px; padding: 10px; cursor: pointer; }
        p { font-weight: bold; }
        #previewImage { max-width: 300px; display: none; border: 2px solid #ddd; margin-top: 10px; }
    </style>
</head>  

<body>  
    <h1>Welcome to the Verbal Communication Skills Trainer!</h1>  

    <!-- Chat Section -->
    <h2>Chat with the AI</h2>  
    <textarea id="userInput" placeholder="Type your message here..."></textarea><br>  
    <button onclick="sendChat()">Send</button>  
    <p id="chatResponse"></p>  

    <!-- Voice Input Section -->
    <h2>Voice Input</h2>  
    <button id="recordButton">Start Recording</button>  
    <button id="stopRecordButton" style="display: none;">Stop Recording</button>  
    <p id="voiceResponse"></p>  

    <!-- Image Upload Section -->
    <h2>Upload an Image for AI Analysis</h2>  
    <input type="file" id="imageUpload" accept="image/*">  
    <img id="previewImage" alt="Image Preview">  
    <button onclick="sendImage()">Analyze Image</button>  
    <p id="imageResponse"></p>  

    <!-- Voice + Image Upload Section -->
    <h2>Upload Image with Voice Input</h2>  
    <input type="file" id="imageUpload2" accept="image/*">  
    <button id="recordButton2">Start Recording</button>  
    <button id="stopRecordButton2" style="display: none;">Stop Recording</button>  
    <button onclick="sendVoiceImage()">Analyze Voice & Image</button>  
    <p id="voiceImageResponse"></p>  

    <script>  
        function sendChat() {  
            const userMessage = document.getElementById('userInput').value;  
            if (!userMessage.trim()) {
                alert("Please enter a message.");
                return;
            }

            $("#chatResponse").text("Processing...");
            
            $.ajax({
                url: "/chat",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify({ message: userMessage }),
                success: function (data) {
                    $("#chatResponse").text(data.response || "Error: No response.");
                },
                error: function () {
                    $("#chatResponse").text("Error: Unable to get a response.");
                }
            });
        }  

        // Voice Recording & Processing
        let mediaRecorder;
        let audioChunks = [];

        function startRecording(buttonId, stopButtonId) {
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(function (stream) {
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.start();
                    console.log("Recording started...");

                    audioChunks = [];
                    mediaRecorder.ondataavailable = function (event) {
                        if (event.data.size > 0) {
                            audioChunks.push(event.data);
                        }
                    };

                    $(`#${buttonId}`).hide();
                    $(`#${stopButtonId}`).show();

                    mediaRecorder.onstop = function () {
                        console.log("Recording stopped.");
                        processAudio('/voice', 'voiceResponse', audioChunks);
                        $(`#${buttonId}`).show();
                        $(`#${stopButtonId}`).hide();
                    };
                })
                .catch(err => {
                    alert("Microphone access denied!");
                    console.error("Microphone error:", err);
                });
        }

        function stopRecording() {
            if (mediaRecorder) {
                mediaRecorder.stop();
            }
        }

        function processAudio(url, responseId, audioChunks) {
            if (audioChunks.length === 0) {
                alert("No audio recorded. Try again.");
                return;
            }

            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
            const formData = new FormData();
            formData.append('audio', audioBlob, 'recorded_audio.wav');

            fetch(url, { method: 'POST', body: formData })
                .then(response => response.json())
                .then(data => {
                    $(`#${responseId}`).text(data.response || "Error processing audio.");
                })
                .catch(error => {
                    console.error("Error processing audio:", error);
                    $(`#${responseId}`).text("Error in processing.");
                });
        }

        $("#recordButton").click(() => startRecording('recordButton', 'stopRecordButton'));
        $("#stopRecordButton").click(stopRecording);

        // Image Upload Preview
        $("#imageUpload").change(function () {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    $("#previewImage").attr("src", e.target.result).show();
                };
                reader.readAsDataURL(file);
            }
        });

        function sendImage() {
            const imageFile = $("#imageUpload")[0].files[0];
            if (!imageFile) {
                alert("Please select an image!");
                return;
            }

            const formData = new FormData();
            formData.append('image', imageFile);

            fetch('/image', { method: 'POST', body: formData })
                .then(response => response.json())
                .then(data => {
                    $("#imageResponse").text(data.response || "Error processing image.");
                })
                .catch(() => {
                    $("#imageResponse").text("Error in processing image.");
                });
        }

        // Voice + Image Upload
        let audioChunks2 = [];

        $("#recordButton2").click(() => {
            audioChunks2 = [];
            startRecording('recordButton2', 'stopRecordButton2');
        });

        $("#stopRecordButton2").click(() => {
            stopRecording();
        });

        function sendVoiceImage() {
            const imageFile = $("#imageUpload2")[0].files[0];
            if (!imageFile) {
                alert("Please select an image!");
                return;
            }

            if (audioChunks2.length === 0) {
                alert("Please record your voice!");
                return;
            }

            const formData = new FormData();
            formData.append('image', imageFile);
            formData.append('audio', new Blob(audioChunks2, { type: 'audio/wav' }), 'recorded_audio.wav');

            fetch('/voice_image', { method: 'POST', body: formData })
                .then(response => response.json())
                .then(data => {
                    $("#voiceImageResponse").text(data.response || "Error processing data.");
                })
                .catch(() => {
                    $("#voiceImageResponse").text("Error in processing.");
                });
        }
    </script>  
</body>  
</html>
